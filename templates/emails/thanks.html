<!doctype html><html><body style="margin:0;background:#04060c;font-family:Arial,Helvetica,sans-serif;color:#e8ecf8">
<table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table width="100%" style="max-width:560px;background:#0b1020;border:1px solid #1d2745;border-radius:16px" cellpadding="0" cellspacing="0">
<tr><td style="padding:28px 28px 8px"><div style="font-size:20px;font-weight:700;color:#5eead4">Akshat Kumar.</div></td></tr>
<tr><td style="padding:8px 28px"><h1 style="margin:0 0 10px;font-size:24px">Thanks for reaching out, {{ name }}!</h1>
<p style="color:#aab4d4;line-height:1.6;margin:0">{{ intro }}</p></td></tr>
{% if rows %}<tr><td style="padding:16px 28px"><table width="100%" cellpadding="8" cellspacing="0" style="border-top:1px solid #1d2745">

<tr><td style="padding:8px 28px 28px"><p style="color:#aab4d4;line-height:1.6">I'll review this and reply within <b style="color:#fff">24–48 hours</b>.</p>
<p style="color:#aab4d4;margin:0">— Akshat Kumar<br>Full Stack Developer · Ranchi, India</p></td></tr></table></td></tr></table></body></html>

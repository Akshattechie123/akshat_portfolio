{% extends "base.html" %}{% block title %}Contact | {{ SITE.name }}{% endblock %}{% block content %}
<section class="wrap page two"><div><p class="eyebrow">Contact</p><h1 class="split">Let's talk.</h1>
<p>Email: <a href="mailto:{{ SITE.email }}">{{ SITE.email }}</a></p><p><a href="{{ SITE.linkedin }}" target="_blank" rel="noopener">LinkedIn</a> · <a href="{{ SITE.github }}" target="_blank" rel="noopener">GitHub</a></p></div>
<div class="glass">
<form data-ajax action="{% url 'contact_submit' %}" novalidate>{% csrf_token %}
<input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<label>Name *<input name="name" required></label><label>Email *<input type="email" name="email" required></label>
<label>Phone<input name="phone"></label><label>Subject<input name="subject"></label>
<label>Message *<textarea name="message" rows="5" required></textarea></label>
<p class="err" role="alert"></p><button class="btn mag">Send message</button></form>
<div class="done" hidden><h2>Message sent</h2><p>Thanks! Check your inbox for a confirmation email.</p><a class="btn mag" href="{% url 'home' %}">Back to home</a></div>
</div></section>{% endblock %}
